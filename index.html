<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
    <meta name="color-scheme" content="dark">
    <style>html, body { background: #000; }</style>
    <script>
        // Light mode: start on the paper background, not black (keep in step
        // with src/grid/settings.ts and palette.ts).
        try {
            var s = JSON.parse(localStorage.getItem('jomity.grid.settings') || '{}');
            var light = s.mode === 'light' || (s.mode !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
            if (light) document.documentElement.style.background = '#edf2ed';
        } catch (e) {}
    </script>
    <title>jomity.net</title>
    <meta name="description" content="Bio for Jonathan Schultz">
    <meta name="theme-color" content="#000000">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jomity.net/">
    <meta property="og:title" content="jomity.net">
    <meta property="og:description" content="Bio for Jonathan Schultz">
    <meta property="og:image" content="https://jomity.net/preview.jpg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
    <meta property="og:image:alt" content="Jonathan Schultz">
    <meta name="twitter:card" content="summary">
</head>
<body>
    <div id="entry"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
