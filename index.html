<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
    <meta name="color-scheme" content="dark">
    <style>html, body { background: #000; }</style>
    <script>
        // /grid in light mode: start on its paper background, not black (keep in
        // step with src/grid/settings.ts and palette.ts).
        try {
            if (location.pathname.startsWith('/grid')) {
                var s = JSON.parse(localStorage.getItem('jomity.grid.settings') || '{}');
                var light = s.mode === 'light' || (s.mode !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
                if (light) document.documentElement.style.background = '#fafafa';
            }
        } catch (e) {}
    </script>
    <title>jomity.net</title>
</head>
<body>
    <div id="entry"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
