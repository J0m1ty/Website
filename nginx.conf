server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # single-page app: unknown paths get index.html (React Router shows the 404 page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts hashed bundles here, safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
