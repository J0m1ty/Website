server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Page paths: the SPA handles them. Anything that isn't / or a real file
    # gets index.html with a 404 status, and React Router shows the 404 page.
    location / {
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }

    # Paths that look like files (robots.txt, llms.txt, .well-known/*.json) are
    # served as-is or get a plain 404, never the HTML page.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Vite puts hashed bundles here, safe to cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
